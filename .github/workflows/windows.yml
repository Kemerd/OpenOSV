# =============================================================================
#  OpenOSV continuous integration (Windows)
#
#  Two jobs:
#    build-cuda   : full configuration (CUDA 12.9 toolkit installed for
#                   compilation only - the runner has no GPU, so [cuda] /
#                   [opencl] / [hwaccel] tests are excluded by the ctest preset)
#    build-cpu    : CPU-only configuration to keep the no-GPU build honest
#
#  The sample clip is not in the repository.  When the OSV_SAMPLE_URL secret is
#  set the clip is downloaded and the [sample] tests run; otherwise they SKIP.
# =============================================================================
name: windows

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-cuda:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA toolkit (compile only)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.9.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          use-github-cache: true

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgJsonGlob: vcpkg.json

      - name: Download sample clip (optional)
        if: ${{ env.OSV_SAMPLE_URL != '' }}
        env:
          OSV_SAMPLE_URL: ${{ secrets.OSV_SAMPLE_URL }}
        run: |
          curl -L -o CAM_20260904090647_0010_D.OSV "$env:OSV_SAMPLE_URL"
        shell: pwsh

      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ci-windows

      - name: Test
        run: ctest --preset ci

      - name: Upload osvtool
        uses: actions/upload-artifact@v4
        with:
          name: osvtool-windows-x64
          path: |
            build/ci-windows/bin/osvtool.exe
            build/ci-windows/bin/*.dll

  build-cpu:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgJsonGlob: vcpkg.json

      - name: Configure (CPU only)
        run: cmake --preset windows-msvc-cpu-only

      - name: Build
        run: cmake --build --preset windows-msvc-cpu-only

      - name: Test
        run: ctest --preset cpu-only --exclude-regex "hwaccel|ffmpeg-exe"
